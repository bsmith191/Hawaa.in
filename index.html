<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hawaa Edge - India's premium air purifier. Experience cleaner air with advanced filtration technology. Made in India with 1 year PAN India warranty.">
    <meta name="keywords" content="air purifier, Hawaa, Hawaa Edge, clean air, India, premium air purifier">

    <!-- Open Graph -->
    <meta property="og:title" content="Hawaa - Premium Air Purifiers">
    <meta property="og:description" content="Hawaa Edge - India's premium air purifier. Experience cleaner air with advanced filtration technology.">
    <meta property="og:type" content="website">

    <title>Hawaa - Premium Air Purifiers | Breathe Clean</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="public/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="header-container">
            <!-- Logo -->
            <a href="/" class="logo">
                <span class="logo-h">H</span><span class="logo-awaa">awaa</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="nav-desktop">
                <a href="#products">Products</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>

            <!-- Hamburger Menu -->
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>

        <!-- Mobile Menu -->
        <nav class="nav-mobile" id="nav-mobile">
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Background Video -->
        <video
            class="hero-video"
            id="hero-video"
            autoplay
            muted
            playsinline
            poster="public/images/hero-poster.jpg"
        >
            <source src="public/videos/hero-video.mp4" type="video/mp4">
            <source src="public/videos/hero-video.webm" type="video/webm">
        </video>

        <!-- Resting Image (shows when video ends) -->
        <div class="hero-resting-image" id="hero-resting"></div>

        <!-- Gradient Overlay -->
        <div class="hero-overlay"></div>

        <!-- Content -->
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="title-hawaa">Hawaa</span>
                <span class="title-edge">EDGE</span>
            </h1>

            <!-- CTA Buttons -->
            <div class="cta-container">
                <a href="#order" class="cta-btn cta-primary">
                    <span>Order Now</span>
                </a>
                <a href="#explore" class="cta-btn cta-secondary">
                    <span>Explore Edge</span>
                </a>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <div class="scroll-mouse">
                <div class="scroll-dot"></div>
            </div>
        </div>
    </section>

    <!-- Trust Badges Section -->
    <section class="trust-badges">
        <div class="trust-container">
            <!-- Section Header -->
            <div class="trust-header">
                <p class="trust-subtitle">WHY CUSTOMERS CHOOSE HAWAA</p>
                <h2 class="trust-title">A trusted brand, built on real outcomes</h2>
            </div>

            <!-- Badges Grid -->
            <div class="badges-grid">
                <!-- Made in India -->
                <div class="badge-item">
                    <div class="badge-icon">
                        <svg class="india-flag" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
                            <rect width="900" height="200" fill="#FF9933"/>
                            <rect y="200" width="900" height="200" fill="#FFFFFF"/>
                            <rect y="400" width="900" height="200" fill="#138808"/>
                            <g transform="translate(450, 300)">
                                <circle r="55" fill="none" stroke="#000080" stroke-width="3"/>
                                <circle r="9" fill="#000080"/>
                                <g id="spokes">
                                    <line x1="12" y1="0" x2="52" y2="0" stroke="#000080" stroke-width="2"/>
                                    <line x1="10.4" y1="6" x2="45" y2="26" stroke="#000080" stroke-width="2"/>
                                    <line x1="6" y1="10.4" x2="26" y2="45" stroke="#000080" stroke-width="2"/>
                                    <line x1="0" y1="12" x2="0" y2="52" stroke="#000080" stroke-width="2"/>
                                    <line x1="-6" y1="10.4" x2="-26" y2="45" stroke="#000080" stroke-width="2"/>
                                    <line x1="-10.4" y1="6" x2="-45" y2="26" stroke="#000080" stroke-width="2"/>
                                    <line x1="-12" y1="0" x2="-52" y2="0" stroke="#000080" stroke-width="2"/>
                                    <line x1="-10.4" y1="-6" x2="-45" y2="-26" stroke="#000080" stroke-width="2"/>
                                    <line x1="-6" y1="-10.4" x2="-26" y2="-45" stroke="#000080" stroke-width="2"/>
                                    <line x1="0" y1="-12" x2="0" y2="-52" stroke="#000080" stroke-width="2"/>
                                    <line x1="6" y1="-10.4" x2="26" y2="-45" stroke="#000080" stroke-width="2"/>
                                    <line x1="10.4" y1="-6" x2="45" y2="-26" stroke="#000080" stroke-width="2"/>
                                </g>
                            </g>
                        </svg>
                    </div>
                    <p class="badge-text">Made in India</p>
                </div>

                <!-- 5 Star Rating -->
                <div class="badge-item">
                    <div class="badge-icon rating-icon">
                        <span class="rating-number">5</span>
                        <svg class="star-icon" viewBox="0 0 24 24" fill="#FACC15">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>
                    <p class="badge-text">Highly Rated</p>
                </div>

                <!-- 1 Year Warranty -->
                <div class="badge-item">
                    <div class="badge-icon warranty-icon">
                        <span class="warranty-number">1</span>
                        <span class="warranty-yr">Yr</span>
                    </div>
                    <p class="badge-text">PAN India Warranty</p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
